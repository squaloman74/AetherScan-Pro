name: Build AetherScan Pro iOS (IPA) - v27-beta2.8 Metrology

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: ios-repo
        run: flutter pub get

      - name: Run Tests
        working-directory: ios-repo
        run: flutter test

      - name: Build iOS Runner (Release unsigned)
        working-directory: ios-repo
        run: |
          flutter build ios --release --no-codesign

      - name: Package Payload and Create unsigned IPA
        working-directory: ios-repo
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r AetherScan-Pro-v27-beta2.8-Metrology-unsigned.ipa Payload
          mkdir -p release-ios
          mv AetherScan-Pro-v27-beta2.8-Metrology-unsigned.ipa release-ios/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherScan-Pro-v27-beta2.8-iOS-IPA
          path: ios-repo/release-ios/*.ipa

      - name: Create GitHub Release with v27-beta2.8 IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v27-beta2.8
          name: "AetherScan Pro v27-beta2.8 Metrology - iOS (IPA Unsigned)"
          body: |
            ## AetherScan Pro v2.0 (v27-beta2.8, Build 279) — Release iOS
            **Data build:** 19/11/2026
            Pacchetto IPA non firmato generato da `ios-repo` allineato a `v27-beta2.8` (K2 Field Meter `deltaEmf.abs()`, `TARA RAPIDA` con valore numerico e modulo Vocale Custom Real-Trigger).
          files: ios-repo/release-ios/*.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
