name: Build AetherScan Pro iOS (IPA) - v27-beta3.0

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag di rilascio per la GitHub Release'
        required: false
        default: 'v27-beta3.0'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: ios-repo
        run: flutter pub get

      - name: Run Tests
        working-directory: ios-repo
        run: flutter test

      - name: Build iOS Runner (Release unsigned)
        working-directory: ios-repo
        run: |
          flutter build ios --release --no-codesign

      - name: Package Payload and Create unsigned IPA
        working-directory: ios-repo
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r AetherScan-Pro-v27-beta3.0-unsigned.ipa Payload
          mkdir -p release-ios
          mv AetherScan-Pro-v27-beta3.0-unsigned.ipa release-ios/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherScan-Pro-v27-beta3.0-iOS-IPA
          path: ios-repo/release-ios/*.ipa

      - name: Create GitHub Release with v27-beta3.0 IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: "AetherScan Pro v27-beta3.0 — Release iOS (IPA Unsigned)"
          body: |
            ## AetherScan Pro v2.0.30 (v27-beta3.0, Build 300) — Release iOS
            **Data build:** 19/11/2026
            Pacchetto IPA non firmato reale generato su macOS via Xcode da `ios-repo/` allineato a `v27-beta3.0`:
            - K2 Field Meter con auto-tara e refresh continuo dei sensori
            - Curva volume logaritmica + Noise Gate
            - Fingerprinting deterministico SHA-256
            - 90/90 Unit & Widget Tests PASS
          files: ios-repo/release-ios/*.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

