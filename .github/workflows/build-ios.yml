name: Build AetherScan Pro iOS (IPA) - v27-beta2.5 Metrology

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: ios-repo
        run: flutter pub get

      - name: Run Tests
        working-directory: ios-repo
        run: flutter test

      - name: Build iOS Runner (Release unsigned)
        working-directory: ios-repo
        run: |
          flutter build ios --release --no-codesign

      - name: Package Payload and Create unsigned IPA
        working-directory: ios-repo
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r AetherScan-Pro-v27-beta2.5-Metrology-unsigned.ipa Payload
          mkdir -p release-ios
          mv AetherScan-Pro-v27-beta2.5-Metrology-unsigned.ipa release-ios/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherScan-Pro-v27-beta2.5-iOS-IPA
          path: ios-repo/release-ios/*.ipa

      - name: Create GitHub Release with v27-beta2.5 IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v27-beta2.5
          name: "AetherScan Pro v27-beta2.5 Metrology - iOS (IPA Unsigned)"
          body: |
            ## AetherScan Pro v2.0 (v27-beta2.5) — Release Ufficiale iOS
            **Data build:** 16/11/2026
            
            ### Novità e Specifiche Metrologiche:
            - ✅ **Motore Audio Sweep Reale iOS**: Riproduzione nativa continua del fruscio statico radio AM/FM filtrato sull'altoparlante di sistema (.defaultToSpeaker).
            - ✅ **Accelerometro Reale iPhone**: Campionamento continuo urti e vibrazioni dinamiche convertito in unità fisiche m/s² uniformi ad Android.
            - ✅ **Feedback Acustico Urto Fisico**: Rilevamento immediato degli urti sul telaio (|A_dyn| ≥ 3.2 m/s²) con segnale acustico istantaneo e segnalazione visiva su plancia.
            - ✅ **Aggiornamento Diretto Senza Cavo**: Tasto dedicato per scaricare il pacchetto IPA direttamente da Safari ed installarlo con AltStore/Scarlet/TrollStore.
            - ✅ **Risolto Overlap Plancia**: Header compatto senza sovrapposizione tra badge e titolo su qualsiasi display.
            - ✅ **Controllo Manuale Flussi**: AM/FM Sweep e Metrology Pro partono spenti (in standby) e vengono attivati a comando dall'operatore.
            - ✅ **Esportazione Forense Diretta**: File CSV RFC 4180 e JSON salvati su disco e condivisi tramite Share Sheet nativo.
            - ✅ **Doppio Trigger Concomitante Obbligatorio**: Allarme acustico subordinato alla coincidenza simultanea tra urto fisico (|A_dyn| ≥ 3.2 m/s²) e anomalia metrologica (Z ≥ 3.5σ).
          files: ios-repo/release-ios/*.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
